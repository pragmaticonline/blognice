name: Migrate 062 oauth
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply 062 to blognice
        run: npx wrangler d1 execute blognice --remote --config wrangler.production.jsonc --file ./migrations/062-oauth.sql --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify tables
        run: npx wrangler d1 execute blognice --remote --config wrangler.production.jsonc --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name LIKE 'oauth_%';"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
