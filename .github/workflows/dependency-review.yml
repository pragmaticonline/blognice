# Dependency review: fails the PR check when a change introduces a
# dependency with a known vulnerability. Advisory-only unless added to
# branch protection's required checks.
name: Dependency Review

on: [pull_request]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v4
