name: Diagnose database sizes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Row counts per table (read-only)
        run: |
          for spec in "blognice:index" "blognice-posts:posts"; do
            db="${spec%%:*}"
            echo "=== ${db} ==="
            tables=$(npx wrangler d1 execute "${db}" --remote --config wrangler.production.jsonc --json --command "SELECT name FROM sqlite_master WHERE type = 'table' AND name NOT LIKE 'sqlite_%' ORDER BY name;" | jq -r '.[0].results[].name')
            for t in $tables; do
              n=$(npx wrangler d1 execute "${db}" --remote --config wrangler.production.jsonc --json --command "SELECT COUNT(*) AS n FROM \"${t}\";" | jq -r '.[0].results[0].n')
              echo "${n} ${t}"
            done | sort -rn | head -n 40
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
