name: Migrate 078 comment sessions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply 078 to blognice-posts
        run: npx wrangler d1 execute blognice-posts --remote --config wrangler.production.jsonc --file ./migrations/078-comment-sessions.sql --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify sessions table
        run: npx wrangler d1 execute blognice-posts --remote --config wrangler.production.jsonc --json --command "SELECT name FROM pragma_table_info('comment_sessions'); SELECT COUNT(*) AS preserved_sessions FROM comment_sessions;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
