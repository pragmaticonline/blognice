name: Temp YouTube test post
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  youtube-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve test555 tenant id
        run: |
          npx wrangler d1 execute blognice --remote --config wrangler.production.jsonc --json --command "SELECT id, slug, public_id, title FROM tenants WHERE public_id='baa4b9393599e691';" 
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Create YouTube test post
        run: |
          TENANT_ID=$(npx wrangler d1 execute blognice --remote --config wrangler.production.jsonc --json --command "SELECT id FROM tenants WHERE public_id='baa4b9393599e691';" | python3 -c "import sys,json; d=json.load(sys.stdin); rows=d[0]['results'] if isinstance(d,list) else d['results']; print(rows[0]['id'] if rows else '')")
          echo "TENANT_ID=$TENANT_ID"
          if [ -z "$TENANT_ID" ]; then echo "no tenant"; exit 1; fi
          TS=$(date +%s)
          # Delete existing youtube test slugs if any
          npx wrangler d1 execute blognice-posts --remote --config wrangler.production.jsonc --command "DELETE FROM posts WHERE tenant_id=$TENANT_ID AND slug IN ('youtube-test','youtube-test-2','youtube-embed-test');"
          # Insert new post with all youtube variants
          BODY=$(cat <<'MD'
          A quick test of YouTube embeds — same pattern as Twitter cards.

          Standalone watch link (should become iframe):

          https://www.youtube.com/watch?v=dQw4w9WgXcQ

          Short link:

          https://youtu.be/dQw4w9WgXcQ

          Shorts:

          https://www.youtube.com/shorts/dQw4w9WgXcQ

          Embed URL:

          https://www.youtube.com/embed/dQw4w9WgXcQ

          Inline link should stay as link: check https://www.youtube.com/watch?v=dQw4w9WgXcQ inside a sentence.

          MD
          )
          # Escape single quotes for SQL
          ESCAPED=$(printf "%s" "$BODY" | sed "s/'/''/g")
          npx wrangler d1 execute blognice-posts --remote --config wrangler.production.jsonc --command "INSERT INTO posts (tenant_id, slug, title, body_md, tags_json, published, created_at, updated_at, author_visible) VALUES ($TENANT_ID, 'youtube-embed-test', 'YouTube embed test', '$ESCAPED', '[]', 1, $TS, $TS, 1);"
          echo "inserted"
          npx wrangler d1 execute blognice-posts --remote --config wrangler.production.jsonc --json --command "SELECT id, slug, title FROM posts WHERE tenant_id=$TENANT_ID AND slug='youtube-embed-test';"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
