name: Diagnose audio narration job

on:
  workflow_dispatch:
    inputs:
      blog:
        description: "Blog public id (e.g. baa4b9393599e691)"
        required: true
        type: string
      post:
        description: "Post id (e.g. 292)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Read post narration state (read-only)
        run: |
          BLOG_SAFE=$(echo "${{ inputs.blog }}" | tr -d "'\"\`;" | head -c 64)
          POST_SAFE=$(echo "${{ inputs.post }}" | tr -d "'\"\`;" | head -c 16)
          TID=$(npx wrangler d1 execute blognice --remote --config wrangler.production.jsonc --json --command "SELECT id FROM tenants WHERE public_id = '${BLOG_SAFE}' LIMIT 1;" | jq -r '.[0].results[0].id // empty')
          if [ -z "${TID}" ]; then echo "No tenant matched."; exit 1; fi
          echo "Tenant id: ${TID}"
          npx wrangler d1 execute blognice-posts --remote --config wrangler.production.jsonc --json --command "SELECT id, slug, title, length(body_md) AS body_chars, audio_key, audio_generation_id, datetime(updated_at,'unixepoch') AS updated_utc FROM posts WHERE id = ${POST_SAFE} AND tenant_id = ${TID};" | jq .
          echo "TID=${TID}" >> "$GITHUB_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Read job manifest from R2 (read-only)
        run: |
          POST_SAFE=$(echo "${{ inputs.post }}" | tr -d "'\"\`;" | head -c 16)
          GENID=$(npx wrangler d1 execute blognice-posts --remote --config wrangler.production.jsonc --json --command "SELECT audio_generation_id FROM posts WHERE id = ${POST_SAFE} AND tenant_id = ${TID};" | jq -r '.[0].results[0].audio_generation_id // empty')
          if [ -z "${GENID}" ] || [ "${GENID}" = "null" ]; then echo "No active generation claim."; exit 0; fi
          echo "Generation id: ${GENID}"
          npx wrangler r2 object get "blognice-media/${TID}/.audio-jobs/${GENID}.json" --file /tmp/audio-job.json || echo "R2_FETCH_FAILED=$?"
          if [ ! -f /tmp/audio-job.json ]; then echo "Manifest unreachable (see R2 error above)."; exit 1; fi
          jq '{jobId, status, completed, segments: (.prompts | length), model, error, creditCost}' /tmp/audio-job.json
          jq -r '.prompts | to_entries[] | "\(.key): \(.value.text | length) chars: \(.value.text[:90])"' /tmp/audio-job.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
