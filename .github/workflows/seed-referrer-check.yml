name: Seed referrer check
on:
  workflow_dispatch:
    inputs:
      public_id:
        description: 'tenant public_id'
        required: true
        default: '0e7ab8132e2e5a52'
permissions:
  contents: read
jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lookup tenant
        run: |
          npx wrangler d1 execute blognice --remote --config wrangler.production.jsonc --json --command "SELECT id, public_id, slug, title, custom_domain FROM tenants WHERE public_id='${{ inputs.public_id }}';"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Seed fake pageview with referrer t.co and x.com
        run: |
          set -e
          HOST=$(npx wrangler d1 execute blognice --remote --config wrangler.production.jsonc --json --command "SELECT coalesce(custom_domain, slug || '.blognice.com') as host FROM tenants WHERE public_id='${{ inputs.public_id }}';" | python3 -c "import sys,json; d=json.load(sys.stdin); rows=d[0]['results'] if isinstance(d,list) else []; print(rows[0]['host'] if rows else '')")
          echo "Host: $HOST"
          if [ -z "$HOST" ]; then echo "no host"; exit 1; fi
          # need visitor UUID and consent headers
          VISITOR=$(python3 -c "import uuid; print(uuid.uuid4())")
          echo "Visitor: $VISITOR"
          for REF in "https://t.co/test123" "https://x.com/test123"; do
            echo "Posting referrer $REF to https://$HOST/_blognice/metrics"
            # try with consent header; origin must equal target origin
            curl -s -i -X POST "https://$HOST/_blognice/metrics" \
              -H "content-type: application/json" \
              -H "origin: https://$HOST" \
              -H "x-blognice-consent: v1" \
              -d "{\"path\":\"/\",\"referrer\":\"$REF\",\"visitor\":\"$VISITOR\",\"consent\":\"v1\"}" || true
            echo "---"
          done
          # second hit as google.com for variety
          curl -s -i -X POST "https://$HOST/_blognice/metrics" \
            -H "content-type: application/json" \
            -H "origin: https://$HOST" \
            -H "x-blognice-consent: v1" \
            -d "{\"path\":\"/\",\"referrer\":\"https://www.google.com/search?q=blognice\",\"visitor\":\"$VISITOR\",\"consent\":\"v1\"}" || true
      - name: Query metrics report via AE (last 30d referrers)
        run: |
          # use node to call metricsReport helper via tsx if needed, but just query AE directly
          ACCOUNT_ID="${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          TOKEN="${{ secrets.CLOUDFLARE_D1_API_TOKEN }}"
          # get tenant id
          TENANT_ID=$(npx wrangler d1 execute blognice --remote --config wrangler.production.jsonc --json --command "SELECT id FROM tenants WHERE public_id='${{ inputs.public_id }}';" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d[0]['results'][0]['id'])")
          echo "Tenant id: $TENANT_ID"
          # query AE SQL
          QUERY="SELECT blob2 AS referrer, SUM(_sample_interval) AS views FROM blognice_pageviews WHERE index1 = '$TENANT_ID' AND timestamp >= NOW() - INTERVAL '30' DAY AND blob2 != '' GROUP BY referrer ORDER BY views DESC LIMIT 25"
          echo "Query: $QUERY"
          curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID/analytics_engine/sql" \
            -H "authorization: Bearer $TOKEN" \
            -H "content-type: text/plain" \
            --data "$QUERY" | python3 -m json.tool || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
