name: Apply affiliate experiment migration

on:
  workflow_dispatch:

concurrency:
  group: production-d1-migration
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Bookmark, migrate, and verify D1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture pre-migration Time Travel bookmark
        run: npx wrangler d1 time-travel info blognice --config wrangler.production.jsonc --json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply migration 055
        run: npx wrangler d1 execute blognice --remote --config wrangler.production.jsonc --file migrations/055-affiliate-experiment-hardening.sql --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify snapshots, immutability triggers, and foreign keys
        run: |
          npx wrangler d1 execute blognice --remote --config wrangler.production.jsonc --json --command "SELECT name, type FROM sqlite_master WHERE name IN ('trg_funnel_experiment_presentation_immutable','trg_affiliate_stripe_experiment_snapshot','trg_affiliate_nowpayments_experiment_snapshot') ORDER BY name; SELECT name FROM pragma_table_info('affiliate_stripe_checkouts') WHERE name IN ('experiment_key','experiment_variant') UNION ALL SELECT name FROM pragma_table_info('affiliate_nowpayments_checkouts') WHERE name IN ('experiment_key','experiment_variant'); PRAGMA foreign_key_check;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
