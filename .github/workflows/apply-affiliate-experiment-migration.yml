name: Apply affiliate experiment migration

on:
  workflow_dispatch:

concurrency:
  group: production-d1-migration
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Bookmark, migrate, and verify D1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture pre-migration Time Travel bookmark
        run: npx wrangler d1 time-travel info blognice --config wrangler.production.jsonc --json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply migration 054
        run: npx wrangler d1 execute blognice --remote --config wrangler.production.jsonc --file migrations/054-affiliate-offer-experiments.sql --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify tables, indexes, draft definition, and foreign keys
        run: |
          npx wrangler d1 execute blognice --remote --config wrangler.production.jsonc --json --command "SELECT name, type FROM sqlite_master WHERE name IN ('funnel_experiments','funnel_experiment_assignments','funnel_experiment_conversions','idx_one_running_affiliate_offer_experiment','idx_funnel_experiment_account','idx_funnel_experiment_results','idx_funnel_experiment_conversions_results') ORDER BY type, name; SELECT experiment_key, status, treatment_allocation_basis_points, control_presentation_version, treatment_presentation_version FROM funnel_experiments WHERE experiment_key = 'affiliate-offer-v1'; PRAGMA foreign_key_check;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
