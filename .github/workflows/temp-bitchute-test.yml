name: Temp Bitchute test post
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bitchute-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve test555 tenant id
        run: |
          npx wrangler d1 execute blognice --remote --config wrangler.production.jsonc --json --command "SELECT id, slug, public_id, title FROM tenants WHERE public_id='baa4b9393599e691';"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Create Bitchute test post
        run: |
          TENANT_ID=$(npx wrangler d1 execute blognice --remote --config wrangler.production.jsonc --json --command "SELECT id FROM tenants WHERE public_id='baa4b9393599e691';" | python3 -c "import sys,json; d=json.load(sys.stdin); rows=d[0]['results'] if isinstance(d,list) else d['results']; print(rows[0]['id'] if rows else '')")
          echo "TENANT_ID=$TENANT_ID"
          if [ -z "$TENANT_ID" ]; then echo "no tenant"; exit 1; fi
          TS=$(date +%s)
          npx wrangler d1 execute blognice-posts --remote --config wrangler.production.jsonc --command "DELETE FROM posts WHERE tenant_id=$TENANT_ID AND slug='bitchute-embed-test';"
          BODY=$(cat <<'MD'
          A quick test of BitChute embeds — same pattern as YouTube.

          Standalone video link (should become iframe):

          https://www.bitchute.com/video/Yk73jJnxdhom/

          Without www:

          https://bitchute.com/video/UGlrF9o9b-Q

          Embed URL:

          https://www.bitchute.com/embed/B32sKqDgGTtZ/

          Inline link should stay as link: check https://www.bitchute.com/video/Yk73jJnxdhom/ inside a sentence.

          MD
          )
          ESCAPED=$(printf "%s" "$BODY" | sed "s/'/''/g")
          npx wrangler d1 execute blognice-posts --remote --config wrangler.production.jsonc --command "INSERT INTO posts (tenant_id, slug, title, body_md, tags_json, published, created_at, updated_at, author_visible) VALUES ($TENANT_ID, 'bitchute-embed-test', 'BitChute embed test', '$ESCAPED', '[]', 1, $TS, $TS, 1);"
          echo "inserted"
          npx wrangler d1 execute blognice-posts --remote --config wrangler.production.jsonc --json --command "SELECT id, slug, title FROM posts WHERE tenant_id=$TENANT_ID AND slug='bitchute-embed-test';"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
