name: Migrate 076 comment votes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply 076 to blognice-posts
        run: npx wrangler d1 execute blognice-posts --remote --config wrangler.production.jsonc --file ./migrations/076-comment-votes.sql --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify columns
        run: npx wrangler d1 execute blognice-posts --remote --config wrangler.production.jsonc --json --command "SELECT name FROM pragma_table_info('comments') WHERE name IN ('likes','dislikes'); SELECT name FROM pragma_table_info('comment_votes') WHERE name IN ('vote');"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
