name: Migrate 077 comment avatar resync
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply 077 to blognice-posts
        run: npx wrangler d1 execute blognice-posts --remote --config wrangler.production.jsonc --file ./migrations/077-comment-avatar-resync.sql --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify no out-of-sync rows remain
        run: npx wrangler d1 execute blognice-posts --remote --config wrangler.production.jsonc --json --command "SELECT COUNT(*) AS out_of_sync FROM comments c WHERE EXISTS (SELECT 1 FROM comment_identities i WHERE i.tenant_id = c.tenant_id AND i.email_hash = c.email_hash AND i.avatar_key IS NOT c.avatar_key);"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
