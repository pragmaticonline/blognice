name: Verify affiliate experiment runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Verify dormant public routes
        run: |
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' https://www.blognice.com/)" = 200
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' https://www.blognice.com/affiliate-offer)" = 302
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' https://www.blognice.com/experiment/affiliate-offer/cta)" = 302

      - name: Verify production experiment is draft and empty
        run: npx wrangler d1 execute blognice --remote --config wrangler.production.jsonc --json --command "SELECT experiment_key, status, required_sample_per_variant, started_at FROM funnel_experiments WHERE experiment_key = 'affiliate-offer-v1'; SELECT (SELECT COUNT(*) FROM funnel_experiment_assignments) AS assignments, (SELECT COUNT(*) FROM funnel_experiment_conversions) AS conversions; PRAGMA foreign_key_check;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify staff analytics credential
        run: npx wrangler secret list --config wrangler.staff.production.jsonc --format json | jq -e 'map(.name) | index("CF_ANALYTICS_TOKEN") != null'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
