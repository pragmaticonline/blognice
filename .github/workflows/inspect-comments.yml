name: Inspect blog comments
on:
  workflow_dispatch:
    inputs:
      blog:
        description: Blog slug (empty lists all blogs with comments enabled)
        required: false
        default: ""
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Show recent comments
        run: |
          BLOG='${{ inputs.blog }}'
          if [ -z "$BLOG" ]; then
            npx wrangler d1 execute blognice --remote --config wrangler.production.jsonc --json --command "SELECT slug, comments_enabled FROM tenants WHERE comments_enabled = 1;"
          else
            TID=$(npx wrangler d1 execute blognice --remote --config wrangler.production.jsonc --json --command "SELECT id FROM tenants WHERE slug = '${BLOG}' LIMIT 1;" | jq -r '.[0].results[0].id // empty')
            echo "tenant_id=${TID}"
            npx wrangler d1 execute blognice-posts --remote --config wrangler.production.jsonc --json --command "SELECT id, post_id, parent_id, author_name, substr(body,1,120) AS body, status, datetime(created_at,'unixepoch') AS created_utc FROM comments WHERE tenant_id = ${TID} ORDER BY id DESC LIMIT 10;"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
