name: Aura voice samples
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Synthesize one paragraph per Aura speaker
        run: |
          TEXT="Blognice is a quieter corner of the internet, built for writers who want their words to last. No feeds shouting for attention, no algorithms deciding what matters. Just a clean page, your voice, and readers who chose to be here. Publish something you are proud of, and it will still be waiting tomorrow."
          echo "paragraph chars: ${#TEXT}"
          for speaker in default angus archer asteria atlas axel gaia helios hera juno jupiter luna lyra mars minerva neptune opal orion orpheus perseus phoebe saturn theia vesta; do
            if [ "$speaker" = "default" ]; then
              body=$(jq -n --arg t "$TEXT" '{text: $t, encoding: "linear16", container: "wav"}')
            else
              body=$(jq -n --arg t "$TEXT" --arg s "$speaker" '{text: $t, speaker: $s, encoding: "linear16", container: "wav"}')
            fi
            code=$(curl -s -o "/tmp/aura-${speaker}.bin" -w "%{http_code}" --request POST \
              --url "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/ai/run/@cf/deepgram/aura-1" \
              --header "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              --header 'Content-Type: application/json' \
              --data "$body")
            bytes=$(stat -c%s "/tmp/aura-${speaker}.bin")
            magic=$(head -c 4 "/tmp/aura-${speaker}.bin")
            echo "speaker=$speaker http=$code bytes=$bytes magic=$magic"
            if [ "$code" != "200" ]; then head -c 300 "/tmp/aura-${speaker}.bin"; echo; fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Upload valid WAVs to media bucket
        run: |
          for f in /tmp/aura-*.bin; do
            name=$(basename "$f" .bin)
            if [ "$(head -c 4 "$f")" = "RIFF" ]; then
              npx wrangler r2 object put "blognice-media/voice-samples/${name}.wav" --file="$f" --content-type=audio/wav --config wrangler.production.jsonc
            else
              echo "skip $name (not WAV)"
            fi
          done
          echo "--- uploaded ---"
          npx wrangler r2 object list blognice-media --prefix voice-samples/ --config wrangler.production.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
