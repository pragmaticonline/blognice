name: Migrate 067-068 blog soft delete and platform settings
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply 067 to blognice
        run: npx wrangler d1 execute blognice --remote --config wrangler.production.jsonc --file ./migrations/067-blog-soft-delete.sql --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply 068 to blognice
        run: npx wrangler d1 execute blognice --remote --config wrangler.production.jsonc --file ./migrations/068-platform-settings.sql --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify columns
        run: npx wrangler d1 execute blognice --remote --config wrangler.production.jsonc --json --command "SELECT name FROM pragma_table_info('tenants') WHERE name IN ('deleted_at'); SELECT name FROM sqlite_master WHERE type = 'table' AND name = 'platform_settings';"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
